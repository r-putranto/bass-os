name: Build Bass OS FOSS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout Bass OS Repo
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
          libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip squashfs-tools \
          python3-mako libssl-dev ninja-build lunzip syslinux syslinux-utils gettext genisoimage \
          bc xorriso xmlstarlet meson glslang-tools git-lfs libncurses5 libncurses5:i386 libncurses-dev libelf-dev \
          aapt zstd rdfind nasm rustc bindgen swig device-tree-compiler mtools libgmp-dev libmpc-dev \
          cpio rsync dosfstools kmod gdisk lz4 cmake libglib2.0-dev python3-pip pkg-config python3-dev \
          python-is-python3 wget
          
          sudo pip3 install mako jinja2 ply pyyaml pyelftools

          mkdir -p ~/bin
          wget -P ~/bin http://commondatastorage.googleapis.com/git-repo-downloads/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Unfold Bass OS Source
        run: |
          bash unfold_bliss.sh

      - name: Inject ARM Translation (libndk)
        run: |
          git clone https://github.com/BlissOS/vendor_google_proprietary_ndk_translation-prebuilt.git vendor/google/proprietary/ndk_translation || true

      - name: Compile FOSS Build ISO with Camera & Display Overrides
        run: |
          bash build_bass.sh --clean --title "Bass" \
            --blissbuildvariant foss \
            --specialvariant "-FOSS" \
            --grubcmdline "hal_camera_rotation=90 video=eDP-1:panel_orientation=right-up" \
            --ethernetmanager \
            --fossapps \
            --tabletnav \
            --clearhotseat \
            --noksu

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bass-OS-FOSS-ISO
          path: |
            iso/*.iso
            aosptree/out/target/product/x86_64/*.iso
          retention-days: 7
